# Downloads the official Godot WebRTC plugin (godotengine/webrtc-native) into client/webrtc/
# and commits it, so online play works in the desktop editor and desktop exports.
# (The browser build doesn't need it: browsers have WebRTC built in.)
# Runs when client/webrtc/VERSION changes; keeps desktop platforms only to limit repo size.
name: Vendor WebRTC plugin
on:
  push:
    paths:
      - client/webrtc/VERSION
      - .github/workflows/vendor-webrtc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat client/webrtc/VERSION)
          mkdir -p /tmp/w && cd /tmp/w
          gh release view "$VERSION" -R godotengine/webrtc-native --json assets --jq '.assets[] | "\(.name) \(.size)"'
          gh release download "$VERSION" -R godotengine/webrtc-native -p '*.zip'
          ls -la
          for z in *.zip; do unzip -q -o "$z" -d unpacked; done
          find unpacked -maxdepth 4 | head -50
      - name: Install into client/webrtc (desktop only)
        run: |
          SRC=$(dirname "$(find /tmp/w/unpacked -name 'webrtc.gdextension' | head -1)")
          echo "plugin folder: $SRC"
          VERSION=$(cat client/webrtc/VERSION)
          rm -rf client/webrtc && mkdir -p client/webrtc
          cp "$SRC/webrtc.gdextension" client/webrtc/
          [ -f "$SRC/LICENSE.md" ] && cp "$SRC"/LICENSE* client/webrtc/ || true
          find "$SRC" -maxdepth 3 -iname '*license*' -exec cp {} client/webrtc/ \; || true
          mkdir -p client/webrtc/lib
          # Keep Linux x86_64, Windows x86_64, macOS (universal) builds only.
          find "$SRC/lib" -maxdepth 1 \( -name '*linux*x86_64*' -o -name '*windows*x86_64*' -o -name '*macos*' \) \
            -exec cp -r {} client/webrtc/lib/ \;
          echo "$VERSION" > client/webrtc/VERSION
          ls -laR client/webrtc | head -40
          du -sh client/webrtc
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/webrtc
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Vendor Godot WebRTC plugin $(cat client/webrtc/VERSION) (desktop platforms)"
          git push
