<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#14151b">
		<title>$GODOT_PROJECT_NAME</title>
		<!--
		Quick Fight web shell. The title screen below is plain HTML/CSS with no downloads, so it
		paints right away while the engine (index.wasm) downloads behind it. When the engine is
		ready the title says "Press any button"; that press also unlocks browser audio, and the
		game skips its own title and opens the mode menu.
		-->
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #fff; background: #14151b; overflow: hidden; touch-action: none;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#title { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
	align-items: center; justify-content: center; background: #14151b; cursor: pointer;
	user-select: none; -webkit-user-select: none; transition: opacity 0.25s; }
#title.gone { opacity: 0; pointer-events: none; }
#title h1 { margin: 0; font-size: clamp(44px, 10vw, 104px); font-weight: 900; letter-spacing: 0.02em;
	color: #fff2a8; text-shadow: 0 4px 0 #000; line-height: 1; text-align: center; }
#title h2 { margin: 0.35em 0 0; font-size: clamp(24px, 5.2vw, 56px); font-weight: 800; color: #00aeef;
	text-shadow: 0 3px 0 #000; letter-spacing: 0.08em; }
#bar { width: min(60vw, 420px); height: 8px; margin-top: 3.2em; background: rgba(255,255,255,0.1);
	border-radius: 4px; overflow: hidden; }
#fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00aeef, #ec008c, #fff200);
	transition: width 0.2s; }
#prompt { margin-top: 1.2em; font-size: clamp(16px, 3vw, 28px); font-weight: 600; min-height: 1.4em; }
#prompt.ready { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
#stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 24px;
	background: linear-gradient(#2b2b2b 0 25%, #fff200 25% 50%, #ec008c 50% 75%, #00aeef 75%); }
#notice { display: none; margin: 1.5em 2em 0; padding: 1em; max-width: 36em; text-align: center;
	background: #5b3943; border: 1px solid #9b3943; border-radius: 8px; color: #e0e0e0; line-height: 1.4; }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Quick Fight needs JavaScript.</noscript>

		<div id="title">
			<h1>QUICK FIGHT</h1>
			<h2>DESIGN TEAM</h2>
			<div id="bar"><div id="fill"></div></div>
			<div id="prompt">Loading…</div>
			<div id="notice"></div>
			<div id="stripes"></div>
		</div>
		<script>
// Time-to-title for the Week 1 gate: the first frame the title is on screen.
requestAnimationFrame(() => { window.qfTitleShownAt = performance.now(); });
		</script>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const title = document.getElementById('title');
	const fill = document.getElementById('fill');
	const prompt = document.getElementById('prompt');
	const notice = document.getElementById('notice');
	let ready = false;
	let pressed = false;

	function fail(err) {
		console.error(err);
		notice.textContent = err instanceof Error ? err.message : String(err);
		notice.style.display = 'block';
		prompt.textContent = '';
	}

	// The game polls window.qfStartPressed on its title screen and goes straight to the mode menu.
	function start() {
		window.qfStartPressed = true;
		title.classList.add('gone');
		setTimeout(() => title.remove(), 300);
		document.getElementById('canvas').focus();
	}

	function press(e) {
		if (pressed) return;
		pressed = true;
		if (e) e.preventDefault();
		if (ready) start();
		else prompt.textContent = 'Starting…';
	}
	title.addEventListener('pointerdown', press);
	window.addEventListener('keydown', press, { once: false });
	window.addEventListener('gamepadconnected', () => {
		// Gamepads have no "press" event: poll until any button goes down.
		(function poll() {
			if (pressed) return;
			for (const pad of navigator.getGamepads()) {
				if (pad && pad.buttons.some((b) => b.pressed)) { press(); return; }
			}
			requestAnimationFrame(poll);
		}());
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing features the game needs:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.style.width = Math.round((current / total) * 100) + '%';
			}
		},
	}).then(() => {
		ready = true;
		window.qfEngineReadyAt = performance.now();
		fill.style.width = '100%';
		if (pressed) {
			start();
		} else {
			prompt.textContent = 'Press any button';
			prompt.classList.add('ready');
		}
	}, fail);
}());
		</script>
	</body>
</html>
