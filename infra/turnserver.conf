# coturn: relay for WebRTC when two players can't connect directly.
# The secret, realm and public IP are passed on the command line from docker-compose.yml.
listening-port=3478
min-port=49160
max-port=49200
use-auth-secret
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
# Relay only to public addresses: never into the VPS's private network.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
total-quota=200
stale-nonce=600
log-file=stdout
